services:
  - type: web
    name: streamshield-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite:///./streamshield.db
      - key: CORS_ORIGINS
        value: "https://streamshield-frontend.onrender.com,http://localhost:5173,https://streamshield.vercel.app"
      - key: AUTO_SEED
        value: true

